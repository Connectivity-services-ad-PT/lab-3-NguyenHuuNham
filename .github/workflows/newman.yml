name: Contract Lint + Newman Tests — team-gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint OpenAPI contracts (Spectral)
        run: npm run lint

      - name: Start Prism mock server (Access Gate)
        run: nohup npm run mock:gate > prism-gate.log 2>&1 &

      - name: Wait for mock server to be ready
        run: npx wait-on http://127.0.0.1:4010/health --timeout 30000

      - name: Start Prism mock server (AI Vision — consumer smoke)
        run: nohup npm run mock:vision > prism-vision.log 2>&1 &

      - name: Wait for AI Vision mock to be ready
        run: npx wait-on http://127.0.0.1:4011/models --timeout 30000

      - name: Run Newman on mock environment
        run: npm run test:mock

      - name: Generate HTML report
        if: always()
        run: npm run test:html

      - name: Show Prism gate log on failure
        if: failure()
        run: cat prism-gate.log || true

      - name: Show Prism vision log on failure
        if: failure()
        run: cat prism-vision.log || true

      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: reports/
