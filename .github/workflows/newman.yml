name: Contract Lint + Newman Tests - team-gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint OpenAPI contracts (Spectral)
        run: npm run lint

      - name: Run Newman against Prism mocks
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p reports

          npm run mock:gate > reports/prism-gate.log 2>&1 &
          GATE_PID=$!
          npm run mock:vision > reports/prism-vision.log 2>&1 &
          VISION_PID=$!

          cleanup() {
            kill "$GATE_PID" "$VISION_PID" 2>/dev/null || true
            wait "$GATE_PID" "$VISION_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          npx wait-on http://127.0.0.1:4010/health --timeout 30000 || {
            cat reports/prism-gate.log
            exit 1
          }
          npx wait-on http://127.0.0.1:4011/models --timeout 30000 || {
            cat reports/prism-vision.log
            exit 1
          }

          test_exit=0
          npm run test:mock 2>&1 | tee reports/newman-cli-log.txt
          test_exit=${PIPESTATUS[0]}

          html_exit=0
          npm run test:html 2>&1 | tee reports/newman-html-cli-log.txt
          html_exit=${PIPESTATUS[0]}

          if [ "$test_exit" -ne 0 ]; then
            exit "$test_exit"
          fi
          exit "$html_exit"

      - name: Show Prism gate log on failure
        if: failure()
        run: cat reports/prism-gate.log || true

      - name: Show Prism vision log on failure
        if: failure()
        run: cat reports/prism-vision.log || true

      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: reports/
