$kind: http-request
name: POST Analytics /analytics/access-events - Gate sends hashed access event
url: "{{analyticsMockUrl}}/analytics/access-events"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{authToken}}
  Prefer: code=202
body:
  type: text
  content: |-
    {
      "eventId": "0196fb3d-4ad7-7d1e-9f49-5d5148d2bad0",
      "cardIdHash": "61d54b7e7cc5b7a81c4da0f987b54e8c0f0fc4fe7b1f22b8ee4e1eb9ec6f63db",
      "gateId": "GATE-01",
      "direction": "IN",
      "decision": "ALLOW",
      "checkedAt": "2026-05-10T08:00:00Z"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Analytics mock accepts access event', function () { pm.response.to.have.status(202); });
      pm.test('Gate can parse Analytics acknowledgement', function () { const json = pm.response.json(); pm.expect(json).to.have.property('eventId'); pm.expect(json.accepted).to.eql(true); });
      pm.test('Consumer sends privacy-safe cardIdHash only', function () { const body = JSON.parse(pm.request.body.raw); pm.expect(body).to.have.property('cardIdHash'); pm.expect(body).to.not.have.property('cardId'); });
    language: text/javascript
order: 1000
