$kind: http-request
name: GET /policies/access/{policyId} - unknown policy returns 404
url: "{{baseUrl}}/policies/access/0196fb3d-4ad7-7d1e-9f49-5d5148d2ffff"
method: GET
headers:
  Authorization: Bearer {{authToken}}
  Prefer: code=404
scripts:
  - type: afterResponse
    code: |-
      pm.test('Unknown policy returns 404', function () { pm.response.to.have.status(404); });
