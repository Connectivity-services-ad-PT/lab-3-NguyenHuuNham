$kind: http-request
name: POST /access/check - allow or deny decision
url: "{{baseUrl}}/access/check"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{authToken}}
  Prefer: code=200
body:
  type: text
  content: |-
    {
      "cardId": "RFID-2026-001",
      "gateId": "GATE-01",
      "direction": "IN",
      "timestamp": "2026-05-10T08:00:00Z",
      "idempotencyKey": "0196fb3d-4ad7-7d1e-9f49-5d5148d2babe"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Decision response matches contract', function () { const json = pm.response.json(); pm.expect(json).to.have.property('decisionId'); pm.expect(['ALLOW', 'DENY']).to.include(json.decision); pm.expect(json).to.have.property('policyId'); pm.expect(json).to.have.property('checkedAt'); });
    language: text/javascript
order: 2000
