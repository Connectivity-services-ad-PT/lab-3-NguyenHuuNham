$kind: http-request
name: POST /access/check - missing token returns 401 or 403
url: "{{baseUrl}}/access/check"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "cardId": "RFID-2026-001",
      "gateId": "GATE-01",
      "direction": "IN",
      "timestamp": "2026-05-10T08:00:00Z"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Unauthorized request returns 401 or 403', function () { pm.expect([401, 403]).to.include(pm.response.code); });
      pm.test('Auth error follows Problem Details when a body is returned', function () { if (pm.response.text()) { const json = pm.response.json(); pm.expect(json.status).to.be.within(400, 599); } });
    language: text/javascript
order: 1000
